name: diet_app
description: GrubOut - calorie, macro and diet tracker with Filipino foods.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.0
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  speech_to_text: ^7.4.0
  crypto: ^3.0.8
  mobile_scanner: ^7.5.0
  in_app_purchase: ^3.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2E7D4F"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F6F7F3"
  image: assets/icon/splash_logo_green.png
  color_dark: "#0E1411"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#F6F7F3"
    image: assets/icon/splash_logo_green.png
    color_dark: "#0E1411"
    image_dark: assets/icon/splash_logo.png

